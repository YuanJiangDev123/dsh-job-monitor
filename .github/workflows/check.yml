name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Static self-check
        run: node scripts/check.mjs
      - name: Unit tests
        run: node --test scripts/test-helpers.mjs
